name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-build-test:
    name: Swift Build & Test (L1)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool
        run: brew install exiftool

      - name: Swift Build
        working-directory: apps/mac-client
        run: |
          set -o pipefail
          swift build 2>&1 | tee /tmp/swift-build.log
        shell: bash

      - name: Dump Swift Build errors on failure
        if: failure()
        working-directory: apps/mac-client
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "### Swift Build failure" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE 'error:|warning:' /tmp/swift-build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            {
              echo "**Swift Build failure — first 80 error/warning lines**"
              echo ''
              echo '```'
              grep -nE 'error:|warning:' /tmp/swift-build.log | head -80 || true
              echo '```'
            } > /tmp/swift-build-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/swift-build-comment.md \
              --repo "${{ github.repository }}" || true
          fi

      - name: Swift Test (L1 Unit)
        working-directory: apps/mac-client
        run: swift test

  xcuitest:
    name: XCUITest (Mock)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/mac-client
        run: xcodegen generate

      - name: MockUITests
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/MockUITests

      - name: KeyboardShortcutTests
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/KeyboardShortcutTests

      - name: CullingEnhancementUITests
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/CullingEnhancementUITests

      - name: ProcessingFlowUITests (mock mode)
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/ProcessingFlowUITests
