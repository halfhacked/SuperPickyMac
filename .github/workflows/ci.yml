name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-build-test:
    name: Swift Build & Test (L1)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool
        run: brew install exiftool

      - name: Swift Build
        working-directory: apps/mac-client
        run: swift build

      - name: Swift Test (L1 Unit)
        working-directory: apps/mac-client
        run: swift test

  xcuitest:
    name: XCUITest (Mock)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/mac-client
        run: xcodegen generate

      - name: MockUITests
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/MockUITests

      - name: KeyboardShortcutTests
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/KeyboardShortcutTests

      - name: CullingEnhancementUITests
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/CullingEnhancementUITests

      - name: ProcessingFlowUITests (mock mode)
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/ProcessingFlowUITests
