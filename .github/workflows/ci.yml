name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-build-test:
    name: Swift Build & Test (L1)
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool
        run: brew install exiftool

      - name: Swift Build
        working-directory: apps/mac-client
        run: |
          set -o pipefail
          swift build 2>&1 | tee /tmp/swift-build.log
        shell: bash

      - name: Dump Swift Build errors on failure
        if: failure()
        working-directory: apps/mac-client
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Extract only hard errors (strip warnings which dominate the log).
          grep -nE ': error:' /tmp/swift-build.log | head -200 > /tmp/swift-errors.log || true
          # Also capture context around the final "Compiling" step that broke.
          tail -200 /tmp/swift-build.log > /tmp/swift-build-tail.log || true
          {
            echo "### Swift Build failure — errors"
            echo '```'
            cat /tmp/swift-errors.log
            echo '```'
            echo '### Tail of build log (last 200 lines)'
            echo '```'
            cat /tmp/swift-build-tail.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            {
              echo "**Swift Build failure — errors only**"
              echo ''
              echo '```'
              cat /tmp/swift-errors.log
              echo '```'
              echo ''
              echo '**Last 200 lines of build log**'
              echo ''
              echo '```'
              cat /tmp/swift-build-tail.log
              echo '```'
            } > /tmp/swift-build-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/swift-build-comment.md \
              --repo "${{ github.repository }}" || true
          fi

      - name: Swift Test (L1 Unit)
        working-directory: apps/mac-client
        run: swift test

  xcuitest:
    name: XCUITest (Mock)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/mac-client
        run: xcodegen generate

      - name: MockUITests
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/MockUITests

      - name: KeyboardShortcutTests
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/KeyboardShortcutTests

      - name: CullingEnhancementUITests
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/CullingEnhancementUITests

      - name: ProcessingFlowUITests (mock mode)
        working-directory: apps/mac-client
        run: |
          xcodebuild test \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -only-testing:SuperPickyUITests/ProcessingFlowUITests
