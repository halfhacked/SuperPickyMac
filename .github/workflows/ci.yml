name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-build-test:
    name: Swift Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift Build
        working-directory: apps/mac-client
        run: swift build

      - name: Swift Test (L1 Unit)
        working-directory: apps/mac-client
        run: swift test

  python-test:
    name: Python Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: python-server
        run: |
          python -m venv .venv
          .venv/bin/pip install flask flask-cors torch torchvision pillow numpy pypinyin birdpreen pytest

      - name: Python Test (L1 Mocked)
        working-directory: python-server
        run: .venv/bin/python -m pytest tests/test_server.py -v

  xcode-build:
    name: Xcode Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode Build
        working-directory: apps/mac-client
        run: |
          xcodebuild build \
            -scheme SuperPicky \
            -destination 'platform=macOS' \
            -configuration Debug
