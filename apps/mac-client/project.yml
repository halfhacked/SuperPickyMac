name: SuperPicky
options:
  bundleIdPrefix: com.superpicky
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  SuperPicky:
    type: application
    platform: macOS
    sources:
      - path: SuperPickyApp
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superpicky.SuperPicky
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SuperPickyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SuperPickyUITests
    dependencies:
      - target: SuperPicky
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SuperPicky

schemes:
  SuperPicky:
    build:
      targets:
        SuperPicky: all
        SuperPickyUITests: [test]
    test:
      targets:
        - SuperPickyUITests
