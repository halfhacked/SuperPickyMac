name: SuperPicky
options:
  bundleIdPrefix: com.superpicky
  deploymentTarget:
    macOS: "14.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  SuperPicky:
    type: application
    platform: macOS
    sources:
      - SuperPickyApp
    dependencies:
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

  SuperPickyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - SuperPickyUITests
    dependencies:
      - target: SuperPicky
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
