name: SuperPicky
options:
  bundleIdPrefix: com.superpicky
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  SuperPickyInference:
    type: framework
    platform: macOS
    sources:
      - path: SuperPickyInference
        excludes:
          - "Resources/**"
      - path: SuperPickyInference/Resources
        buildPhase: resources
        excludes:
          - "Models/FlightDetector.mlpackage"
          - "Models/KeypointDetector.mlpackage"
          - "Models/YOLOBirdDetector.mlpackage"
          - "Models/OSEAClassifier.mlpackage"
      - path: SuperPickyInference/Resources/Models/FlightDetector.mlmodelc
        buildPhase: resources
      - path: SuperPickyInference/Resources/Models/KeypointDetector.mlmodelc
        buildPhase: resources
      - path: SuperPickyInference/Resources/Models/YOLOBirdDetector.mlmodelc
        buildPhase: resources
      - path: SuperPickyInference/Resources/Models/OSEAClassifier.mlmodelc
        buildPhase: resources
      - path: SuperPickyInference/Resources/bird_reference.sqlite
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superpicky.SuperPickyInference
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES

  SuperPicky:
    type: application
    platform: macOS
    sources:
      - path: SuperPickyApp
    postBuildScripts:
      - name: "Bundle Python Server"
        script: |
          SERVER_SRC="${PROJECT_DIR}/../../python-server"
          SERVER_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/python-server"
          rm -rf "$SERVER_DST"
          mkdir -p "$SERVER_DST/inference"
          cp "$SERVER_SRC/superpicky_server.py" "$SERVER_DST/"
          cp "$SERVER_SRC/requirements.txt" "$SERVER_DST/"
          cp "$SERVER_SRC/inference/"*.py "$SERVER_DST/inference/"
    dependencies:
      - package: GRDB
      - target: SuperPickyInference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superpicky.SuperPicky
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.0.2"
        CURRENT_PROJECT_VERSION: "2"

  SuperPickyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SuperPickyUITests
    dependencies:
      - target: SuperPicky
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SuperPicky

schemes:
  SuperPicky:
    build:
      targets:
        SuperPicky: all
        SuperPickyUITests: [test]
    test:
      targets:
        - SuperPickyUITests
